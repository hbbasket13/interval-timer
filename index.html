<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#171A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Champ</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-phase="idle" data-view="home">

<!-- keeps the audio session alive so cues still fire with the screen off -->
<audio id="keepalive" src="assets/silence.wav" loop playsinline preload="auto"></audio>

<!-- ================= TIMER ================= -->
<main class="stage" id="stage">
  <div class="stage-top">
    <button class="icon" id="backToHome" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <p class="wname" id="wname"></p>
  </div>

  <p class="phase" id="phase">Ready</p>
  <p class="clock" id="clock">0:00</p>
  <p class="meta" id="meta">Round –/–</p>
  <p class="upnext" id="upnext"></p>

  <div class="bar"><span id="bar"></span></div>

  <div class="controls">
    <button class="primary" id="start">Start</button>
    <button class="ghost" id="reset">Reset</button>
  </div>
</main>

<!-- ================= HOME ================= -->
<section class="sheet" id="home">
  <header class="hero">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Champ</h1>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langEn" aria-pressed="true">EN</button>
      <button type="button" id="langKo" aria-pressed="false">한국어</button>
    </div>
  </header>

  <div class="block">
    <p class="eyebrow" id="ttlQuick">Quick start</p>
    <div class="presets" id="presets"></div>
    <div class="grid">
      <div class="field">
        <label for="work" id="lblWork">Work</label>
        <div class="fv"><input id="work" type="number" inputmode="numeric" min="1" max="3600" value="40"><span>s</span></div>
      </div>
      <div class="field">
        <label for="rest" id="lblRest">Rest</label>
        <div class="fv"><input id="rest" type="number" inputmode="numeric" min="0" max="3600" value="20"><span>s</span></div>
      </div>
      <div class="field">
        <label for="rounds" id="lblRounds">Rounds</label>
        <div class="fv"><input id="rounds" type="number" inputmode="numeric" min="1" max="99" value="10"><span>×</span></div>
      </div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="skipLast" checked> <span id="lblSkip">Skip final rest</span></label>
      <label><input type="checkbox" id="prep" checked> <span id="lblPrep">5s countdown</span></label>
      <label><input type="checkbox" id="voice"> <span id="lblVoice">Voice cues</span></label>
    </div>
    <p class="total" id="total"></p>
    <button class="primary wide" id="go">Start</button>
  </div>

  <div class="block">
    <div class="block-head">
      <p class="eyebrow" id="ttlCustom">My workouts</p>
      <button class="link" id="newWorkout">+ <span id="lblNew">New</span></button>
    </div>
    <ul class="list" id="wlist"></ul>
    <p class="empty" id="wempty"></p>
  </div>

  <p class="foot" id="foot"></p>
</section>

<!-- ================= EDITOR ================= -->
<section class="sheet" id="editor">
  <header class="ehead">
    <button class="icon" id="editorBack" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <input id="ename" class="ename" type="text" maxlength="40" placeholder="Workout name">
    <button class="link strong" id="saveWorkout" data-i18n="save">Save</button>
  </header>

  <div class="block">
    <p class="eyebrow" id="ttlSegs">Segments</p>
    <ul class="segs" id="segs"></ul>
    <div class="addrow">
      <button class="add work" id="addWork">+ <span id="lblAddWork">Work</span></button>
      <button class="add rest" id="addRest">+ <span id="lblAddRest">Rest</span></button>
    </div>
  </div>

  <div class="block">
    <div class="field row">
      <label for="erepeat" id="lblRepeat">Repeat whole set</label>
      <div class="fv"><input id="erepeat" type="number" inputmode="numeric" min="1" max="50" value="1"><span>×</span></div>
    </div>
    <p class="total" id="etotal"></p>
    <button class="ghost wide" id="deleteWorkout" data-i18n="delete">Delete</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
